<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student CRUD - Flask + SQLite</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #4CAF50; color: white; }
        a.btn { padding: 5px 10px; text-decoration: none; border-radius: 4px; margin-right: 5px; }
        a.edit { background: #2196F3; color: white; }
        a.delete { background: #f44336; color: white; }
        a.add-btn { display: inline-block; margin-bottom: 15px; padding: 8px 15px;
                    background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Student Management (Flask + SQLite CRUD)</h1>
    <a class="add-btn" href="{{ url_for('add') }}">+ Add New Student</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student['id'] }}</td>
            <td>{{ student['name'] }}</td>
            <td>{{ student['email'] }}</td>
            <td>{{ student['course'] }}</td>
            <td>
                <a class="btn edit" href="{{ url_for('edit', id=student['id']) }}">Edit</a>
                <a class="btn delete" href="{{ url_for('delete', id=student['id']) }}"
                   onclick="return confirm('Are you sure you want to delete this record?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
